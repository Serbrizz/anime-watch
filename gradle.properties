org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- AnimeWatch ----
# Versione dell'app, unica fonte: versionName = appVersion, versionCode = major*10000 + minor*100 + patch.
# La incrementa release.ps1: non modificarla a mano.
appVersion=0.1.0
# Repository GitHub (pubblico) delle release: l'app vi controlla gli aggiornamenti.
appReleaseRepo=Serbrizz/anime-watch
# SHA-1 del certificato che firma TUTTI gli APK (debug e release, su ogni PC). Non deve cambiare mai:
# Android rifiuterebbe gli aggiornamenti e l'accesso con Google (SHA-1 registrato su Firebase) smetterebbe di funzionare.
appSigningSha1=50:6C:9E:18:9D:7E:E2:CC:4D:20:F6:83:FB:63:BF:3D:79:05:07:9B
# Proxy AI (Cloudflare Worker in proxy/) che custodisce la chiave OpenRouter: l'app lo chiama col token Firebase.
aiProxyUrl=https://animewatch-ai.animewatch-ai-proxy.workers.dev/
