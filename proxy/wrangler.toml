# Proxy AI di AnimeWatch (Cloudflare Worker): vedi CLAUDE.md §6 e §8.
# La chiave Gemini (Google AI Studio, piano gratuito) è un segreto, non sta qui: npx wrangler secret put GEMINI_API_KEY
name = "animewatch-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
FIREBASE_PROJECT_ID = "anime-watch-873b9"
# In ordine di preferenza, separati da virgola: se uno è sovraccarico (503) o ha finito la quota gratuita (429), che è
# per modello, si prova il successivo. Il primo è un alias che segue l'ultima versione: Google ritira spesso i modelli
# (gemini-2.5-* non esiste più per le chiavi nuove). Modelli disponibili: GET .../v1beta/models con la chiave.
GEMINI_MODELS = "gemini-flash-lite-latest,gemini-3.1-flash-lite"
# Quanto ragiona prima di rispondere: "low" basta per scegliere da una lista e risponde in pochi secondi.
GEMINI_THINKING = "low"
# Comprende i token di ragionamento.
MAX_TOKENS = "4000"

# Richieste per utente (uid Firebase): un ricalcolo dei consigliati con l'AI ne fa una, il preflight un'altra.
[[ratelimits]]
name = "PER_USER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[observability]
enabled = true
